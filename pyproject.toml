[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "tinyann"
version = "0.1.0"
description = "Small C++ vector search. Python exposes the exact cosine index."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.15"
cmake.args = ["-G", "Unix Makefiles"]
ninja.make-fallback = true
sdist.include = ["include/**", "python/**", "CMakeLists.txt"]

[tool.scikit-build.cmake.define]
TINYANN_BUILD_PYTHON = "ON"
TINYANN_BUILD_CLI = "OFF"
TINYANN_BUILD_TESTS = "OFF"
TINYANN_INSTALL = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_python.py"]
